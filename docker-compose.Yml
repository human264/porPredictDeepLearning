services:
  db:
    image: pgvector/pgvector:pg16  # ✅ 공식 리포 & PG16 태그
    container_name: pgvector_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./setup_with_dummy.sql:/docker-entrypoint-initdb.d/10_setup_with_dummy.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pg_data:
